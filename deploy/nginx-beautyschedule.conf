# ==============================================================================
# Configuração de Proxy Reverso Nginx para o BeautySchedule no Ubuntu Linux
#
# Instalação na VM Ubuntu:
#   sudo cp deploy/nginx-beautyschedule.conf /etc/nginx/sites-available/beautyschedule
#   sudo ln -s /etc/nginx/sites-available/beautyschedule /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
